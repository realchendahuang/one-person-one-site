name: Auto-ingest site submission

# 提交者填完「提交一个网站」Issue 表单后自动收录：
# 解析表单 → 校验 → 可用性探测 → 写入 data/sites.json → 提交 → 触发 Pages 部署
# → 回复并关闭 Issue。全程无人参与。
#
# 维护者手动放行：在 Issue 上添加 accepted 标签，工作流会跳过可用性探测与排除清单重新收录。
#
# 幂等保证：
#   - 同一状态（按 Issue 正文指纹）不重复评论；
#   - 已处理的 Issue 不会重复写入数据（duplicate 判定兜底）。
#
# 注意：GITHUB_TOKEN 推送的提交不会触发其它工作流，因此部署通过
# workflow_dispatch 显式触发 deploy.yml —— 这是 GITHUB_TOKEN 唯一被豁免的事件。

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  # 全局串行：多个 Issue 同时提交时避免并发推送冲突
  group: ingest-submissions
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to ingest
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 一律经 env 传入：${{ }} 的值会在 bash 解析前被直接替换进脚本文本，
          # 只有环境变量能保证内容不被当作命令执行。
          number: ${{ github.event.issue.number }}
          repo: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 维护者打上 accepted 标签 → 人工放行，跳过探测与排除清单
          labels=$(gh api "repos/${repo}/issues/${number}/labels" --jq '.[].name' 2>/dev/null || true)
          if echo "$labels" | grep -qx "accepted"; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

          echo "number=${number}" >> "$GITHUB_OUTPUT"

          # 保存正文与历史评论，供解析步骤与幂等判断使用
          gh api "repos/${repo}/issues/${number}" --jq '.body // ""' > /tmp/issue-body.md
          gh api "repos/${repo}/issues/${number}/comments" --paginate --jq '.[].body' \
            > /tmp/issue-comments.txt 2>/dev/null || true
          wc -c /tmp/issue-body.md

      - name: Parse submission
        id: parse
        env:
          ISSUE_NUMBER: ${{ steps.gate.outputs.number }}
          FORCE: ${{ steps.gate.outputs.force }}
        run: |
          set -euo pipefail
          # --force 由 env 里的布尔值决定，避免把表达式拼进命令行
          force_flag=""
          [ "$FORCE" = "true" ] && force_flag="--force"
          python3 scripts/ingest_issue.py /tmp/issue-body.md \
            --result /tmp/ingest-result.json \
            --comment-file /tmp/comment.md \
            --marker-file /tmp/marker.txt \
            --github-output "$GITHUB_OUTPUT" \
            --issue-number "$ISSUE_NUMBER" \
            $force_flag
          echo "--- 解析结果 ---"
          sed -n '1,20p' /tmp/ingest-result.json

      - name: Validate and regenerate
        if: steps.parse.outputs.status == 'accepted'
        env:
          # 只给 pip 用；不需要任何密钥
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow

          # 先补齐新站点的图标：失败不阻断收录，缺失时会退化成首字母色块
          python3 scripts/fetch_favicons.py || echo "favicon 抓取失败，使用首字母兜底"

          python3 scripts/build_assets.py
          python3 scripts/validate.py
          python3 scripts/generate_directory.py
          python3 tests/test_validate.py
          python3 tests/test_ingest.py
          python3 tests/test_health.py
          python3 scripts/generate_site.py
          python3 tests/test_build.py

      - name: Commit
        if: steps.parse.outputs.status == 'accepted'
        env:
          # 必须走 env 而不是直接写进 run: —— ${{ }} 是在 bash 解析之前做文本替换的，
          # 站点名里的 $(...) 或反引号会被当作命令执行（提交者是任意 Issue 作者）。
          # 环境变量的值不会被 shell 二次解析。
          COMMIT_MESSAGE: ${{ steps.parse.outputs.commit_message }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          # site/ 已被 .gitignore 忽略，这里只提交数据、生成物与新抓取的图标
          git add data/sites.json data/favicons assets DIRECTORY.md README.md README_EN.md
          git commit -m "$COMMIT_MESSAGE"
          # 兼容期间可能出现的其他人推送：先变基再推送
          git pull --rebase --autostash origin main
          git push origin main

      - name: Trigger Pages deployment
        if: steps.parse.outputs.status == 'accepted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "已触发 Pages 部署"

      - name: Should comment
        id: comment_gate
        env:
          STATUS: ${{ steps.parse.outputs.status }}
        run: |
          set -euo pipefail
          if [ "$STATUS" = "skipped" ] || [ ! -s /tmp/comment.md ]; then
            echo "comment=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 同一正文指纹下，同一结论已评论过就不再重复打扰提交者
          if [ -s /tmp/marker.txt ] && [ -s /tmp/issue-comments.txt ] && \
             grep -qF -- "$(cat /tmp/marker.txt)" /tmp/issue-comments.txt; then
            echo "comment=false" >> "$GITHUB_OUTPUT"
            echo "已存在相同结论的评论，跳过回复"
          else
            echo "comment=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on issue
        if: steps.comment_gate.outputs.comment == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.number }}
        run: |
          set -euo pipefail
          # 评论正文从文件读入，不经过 ${{ }} 替换
          gh api --method POST \
            "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(cat /tmp/comment.md)" > /dev/null
          echo "已发布评论"

      - name: Close issue
        if: steps.parse.outputs.is_accepted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.number }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${REPO}/issues/${ISSUE_NUMBER}" \
            -f state=closed > /dev/null
          echo "已关闭 Issue"
