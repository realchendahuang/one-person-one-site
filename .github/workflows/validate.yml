name: Validate directory

# 数据与生成物的守门人：
#   - 规则测试（含 schema 与校验器一致性）
#   - 收录数据校验
#   - 生成物必须已提交（DIRECTORY.md / README 站点表格）
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # 完整历史：HISTORY 区间由 git log 统计提交，浅克隆会退化成「1 次提交」
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate site data
        run: python3 scripts/validate.py

      - name: Run rule tests
        run: python3 tests/test_validate.py

      - name: Regenerate directory
        run: python3 scripts/generate_directory.py

      # --check 会重跑生成器并与已提交内容比对；README 的 HISTORY 区间
      # 由 git log 生成，内容允许落后一个提交，会被自动豁免。
      - name: Check generated files are committed
        run: python3 scripts/validate.py --check
