name: Validate directory

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate site data
        run: python3 scripts/validate.py
      - name: Regenerate directory
        run: python3 scripts/generate_directory.py
      - name: Check generated files are committed
        run: git diff --exit-code -- DIRECTORY.md README.md README_EN.md
