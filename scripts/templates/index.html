<script>
  (function() {
    var stored = localStorage.getItem("opos-theme") || "system";
    document.documentElement.setAttribute("data-theme-mode", stored);
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (stored === "dark" || (stored === "system" && prefersDark)) {

    } else {

        <span>搜索</span>
      </button>

      <!-- 漫游按钮 -->

        <span>提交</span>
      </a>

      <!-- 主题切换 -->
      <button id="btn-theme" class="h-icon-btn" type="button" title="切换主题" aria-label="切换主题">

<main class="main-wrapper">
  <h1 class="sr-only">一人一站 · 值得长期阅读的独立博客与个人网站目录</h1>
  <p class="sr-only">共收录 __SITE_COUNT__ 个由真实创作者独立经营的博客、数字花园与个人作品集。</p>

  <!-- 控制条：单行横滑标签 + 排序分段 -->
  <div class="bar-controls">
    <div class="tags-scroll">
      <div id="tags-bar" class="tags-bar"></div>
      <button id="search-chip" class="active-search-chip" type="button" title="清除搜索" hidden>
        <span id="search-chip-text"></span>
        <span aria-hidden="true" style="font-size:0.7rem;margin-left:2px;">✕</span>
      </button>
    </div>

    <div class="sort-group" role="group" aria-label="排序方式">
      <button type="button" class="sort-btn active" data-sort="default" aria-pressed="true">推荐</button>
      <button type="button" class="sort-btn" data-sort="name" aria-pressed="false">字母序</button>
      <button type="button" class="sort-btn" data-sort="random" aria-pressed="false">随机</button>
    </div>
  </div>

  <!-- 站点卡片：构建期已完成静态渲染，禁用 JS 时同样可见可点 -->
  <div id="sites-grid" class="sites-grid">
__CARDS__
  </div>

  <!-- 空状态 -->
  <div id="empty-state" class="empty-state" hidden>
    <p>没有符合当前条件的站点</p>
    <button id="btn-reset" class="h-btn" type="button">清除筛选</button>
  </div>
</main>

<!-- 全局响应式搜索弹窗 (带左右滑动手势标签栏) -->
<div id="search-modal" class="search-backdrop" role="dialog" aria-modal="true" aria-label="搜索站点" hidden>
  <div class="search-box">
    <div class="search-input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <label for="search-input" class="sr-only">搜索站点名称、作者、简介或标签</label>
      <input id="search-input" class="search-input-field" placeholder="搜索站点名称、作者、简介或标签…" autocomplete="off">
      <button id="search-close-btn" class="search-close-btn" type="button" aria-label="关闭搜索">✕</button>
    </div>
    <!-- 弹窗内支持左右滑动的分类标签 -->
    <div id="search-modal-tags" class="search-tags-row"></div>
    <div id="search-results" class="search-results-list"></div>
  </div>
</div>

<!-- 浮动 Toast 提示 -->
